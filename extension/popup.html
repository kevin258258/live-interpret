<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Live Interpret</title>
  </head>
  <body>
    <header>
      <span class="mark">li</span>
      <div><strong>Live Interpret</strong><small>现场，听得懂。</small></div>
      <span class="dot" id="status-dot"></span>
    </header>
    <p id="pair-help">
      从应用菜单打开 Live Interpret，在面板里点击「一键连接扩展」即可。
    </p>
    <details id="pairing-panel">
      <summary>手动连接（备用）</summary>
      <label for="pairing">本机工作台连接地址</label
      ><input
        id="pairing"
        type="password"
        placeholder="粘贴面板提供的备用连接地址"
        autocomplete="off"
      /><button id="pair" class="secondary">连接工作台</button>
    </details>
    <div id="paired" hidden>
      <div class="connection">
        已配对本机工作台 <button id="re-pair" class="link">更换</button>
      </div>
      <p>在当前 YouTube／Twitch 标签页开始，字幕会直接显示在播放器上。</p>
    </div>
    <div id="message" role="status" aria-live="polite"></div>
    <button id="start" class="primary">开始同传 <span>↗</span></button>
    <button id="stop" class="secondary" hidden>停止同传</button>
    <footer>
      <button id="dashboard" class="link">打开面板</button
      ><span>隐藏字幕 <kbd>Alt ⇧ S</kbd></span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
